[defaults]
inventory = inventory.ini
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
# accept-new: records a host's key the first time it is seen, but still refuses
# if a known host's key later CHANGES (safer than disabling host key checking).
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
