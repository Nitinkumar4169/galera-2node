# EDIT THIS FIRST.
# Only the 2 Galera VMs go here. ProxySQL and garbd run inside Kubernetes
# (see k8s/proxysql-garbd.yaml.j2) and are NOT Ansible-managed hosts.
#
# ansible_host = the IP Ansible SSHes to
# private_ip   = the IP the Galera nodes use to talk to each other AND the IP
#                that ProxySQL/garbd (in Kubernetes) must be able to reach.
#                On a flat LAN (e.g. 192.168.1.0/24) these are the same address.
[galera]
galera1 ansible_host=192.168.0.151 private_ip=192.168.0.151
galera2 ansible_host=192.168.0.152 private_ip=192.168.0.152

[all:vars]
ansible_user=bizaxl
# Passwordless SSH key on the machine you run Ansible from (see README step 2)
ansible_ssh_private_key_file=~/.ssh/id_ed25519

[local]
localhost ansible_connection=local
